services:
  - type: web
    name: vc-funding-analytics
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: python prepare_cloud_db.py && gunicorn --workers 1 --threads 4 --timeout 90 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        value: sqlite:///cloud.db
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
